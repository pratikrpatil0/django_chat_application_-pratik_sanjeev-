<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - Django Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --fb-blue: #1877f2;
            --fb-blue-hover: #166fe5;
            --fb-green: #42b72a;
            --fb-green-hover: #36a420;
            --fb-bg: #f0f2f5;
            --fb-text: #1c1e21;
            --fb-radius: 6px;
            --fb-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--fb-bg);
            color: var(--fb-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header {
            margin-bottom: 16px;
            text-align: center;
        }

        .header .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--fb-blue);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 5px;
        }

        .signup-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: var(--fb-shadow);
            width: 100%;
            max-width: 432px;
            padding: 20px;
        }

        .signup-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #dadde1;
        }

        .signup-header h1 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .signup-header p {
            color: #606770;
            font-size: 0.95rem;
        }

        .error-message {
            color: #f02849;
            background-color: #ffebe8;
            border: 1px solid #f02849;
            padding: 12px;
            margin-bottom: 16px;
            border-radius: var(--fb-radius);
            font-size: 0.9rem;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 10px;
            flex: 1;
        }

        .form-input {
            width: 100%;
            padding: 11px;
            border: 1px solid #dddfe2;
            border-radius: var(--fb-radius);
            font-size: 0.95rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--fb-blue);
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2);
        }

        .register-btn {
            width: 100%;
            background-color: var(--fb-green);
            color: white;
            border: none;
            border-radius: var(--fb-radius);
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 16px;
            margin-top: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .register-btn:hover {
            background-color: var(--fb-green-hover);
        }

        .login-link {
            text-align: center;
            margin-top: 28px;
        }

        .login-link a {
            color: var(--fb-blue);
            font-weight: 500;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .policy-text {
            font-size: 0.85rem;
            color: #777;
            text-align: center;
            margin-top: 20px;
        }

        .password-strength {
            height: 4px;
            margin-top: 8px;
            border-radius: 2px;
            background-color: #f0f0f0;
            overflow: hidden;
            position: relative;
        }

        .password-strength span {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            transition: width 0.3s, background-color 0.3s;
        }

        .strength-weak {
            background-color: #f02849;
            width: 33%;
        }

        .strength-medium {
            background-color: #f7b928;
            width: 66%;
        }

        .strength-strong {
            background-color: var(--fb-green);
            width: 100%;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="header">
        <a href="/" class="logo">django chat</a>
    </div>
    
    <div class="signup-container">
        <div class="signup-header">
            <h1>Create a new account</h1>
            <p>It's quick and easy.</p>
        </div>
        
        <form method="POST" id="register-form">
            {% csrf_token %}
            
            {% if error_message %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i> {{ error_message }}
            </div>
            {% endif %}
            
            <div class="form-row">
                <div class="form-group">
                    <input type="text" name="username" id="username" class="form-input" placeholder="Username" required>
                </div>
                
                <div class="form-group">
                    <input type="email" name="email" id="email" class="form-input" placeholder="Email" required>
                </div>
            </div>
            
            <div class="form-group">
                <input type="password" name="password1" id="password1" class="form-input" placeholder="New password" required>
                <div class="password-strength">
                    <span id="strength-indicator"></span>
                </div>
            </div>
            
            <div class="form-group">
                <input type="password" name="password2" id="password2" class="form-input" placeholder="Confirm password" required>
            </div>
            
            <button type="submit" class="register-btn">Sign Up</button>
            
            <div class="policy-text">
                By clicking Sign Up, you agree to our Terms, Privacy Policy and Cookies Policy.
            </div>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="{% url 'login' %}">Log In</a>
        </div>
    </div>
    
    <script>
        $(document).ready(function() {
            // Password strength indicator
            $('#password1').on('input', function() {
                const password = $(this).val();
                let strength = 0;
                
                if (password.length > 6) strength += 1;
                if (password.match(/[A-Z]/)) strength += 1;
                if (password.match(/[0-9]/)) strength += 1;
                if (password.match(/[^a-zA-Z0-9]/)) strength += 1;
                
                const $indicator = $('#strength-indicator');
                
                if (password.length === 0) {
                    $indicator.removeClass().css('width', '0');
                } else if (strength < 2) {
                    $indicator.removeClass().addClass('strength-weak');
                } else if (strength < 4) {
                    $indicator.removeClass().addClass('strength-medium');
                } else {
                    $indicator.removeClass().addClass('strength-strong');
                }
            });
            
            // Form validation
            $('#register-form').submit(function(e) {
                let isValid = true;
                
                // Check if passwords match
                if ($('#password1').val() !== $('#password2').val()) {
                    alert('Passwords do not match');
                    isValid = false;
                }
                
                // Password too short
                if ($('#password1').val().length < 6) {
                    alert('Password must be at least 6 characters');
                    isValid = false;
                }
                
                if (!isValid) {
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
